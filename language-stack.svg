    <g class="stack-row" style="animation-delay:0ms">
      <circle cx="54" cy="107" r="5" fill="#5594c8"/>
      <text x="72" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="800" fill="#e6edf3">Python</text>
