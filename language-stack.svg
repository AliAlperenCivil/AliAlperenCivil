      <rect x="330" y="162" width="466" height="9" rx="4.5" fill="rgba(255,255,255,0.12)"/>
      <rect class="stack-bar" x="330" y="162" width="29" height="9" rx="4.5" fill="#f34b7d" opacity="0.95"/>
    </g>
    <g class="stack-row" style="animation-delay:285ms">
      <circle cx="54" cy="203" r="5" fill="#8f8f8f"/>
      <text x="72" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="800" fill="#e6edf3">C</text>
      <text x="306" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="850" fill="#8f8f8f" text-anchor="end">2%</text>
