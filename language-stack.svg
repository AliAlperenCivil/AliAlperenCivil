      <circle cx="54" cy="235" r="5" fill="#e34c26"/>
      <text x="72" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="800" fill="#e6edf3">HTML</text>
      <text x="306" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="850" fill="#e34c26" text-anchor="end">2%</text>
      <rect x="330" y="226" width="466" height="9" rx="4.5" fill="rgba(255,255,255,0.12)"/>
